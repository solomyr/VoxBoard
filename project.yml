name: VoxBoard
include:
  - path: signing.local.yml
    optional: true
options:
  bundleIdPrefix: app.voxboard
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
  generateEmptyDirectories: true
  groupSortPosition: top
  # Unset, XcodeGen picks the alphabetically first config, AppStore, for builds that name no scheme.
  defaultConfig: Debug

# AppStore is the configuration the App Store archive is built with; it alone compiles the paywall.
configs:
  Debug: debug
  Release: release
  AppStore: release

settings:
  configs:
    AppStore:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"
  base:
    SWIFT_VERSION: "6.1"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    GCC_TREAT_WARNINGS_AS_ERRORS: true
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: true
    ENABLE_USER_SCRIPT_SANDBOXING: false

# Pinned, not floored: `from:` lets a fresh checkout resolve above the version the code was
# written against, so an older commit stops building -- e137cc2 declared FluidAudio 0.7.9 and
# picked up 0.15.5, whose AsrManager API is different. Upgrades stay a deliberate edit here.
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: "1.1.0"
  DSWaveformImage:
    url: https://github.com/dmrschmidt/DSWaveformImage.git
    exactVersion: "14.3.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.15.5"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: "0.9.20"
  Moonshine:
    url: https://github.com/moonshine-ai/moonshine-swift.git
    exactVersion: "0.0.49"
localPackages:
  - Packages/LlamaCpp

targets:
  Sayboard:
    type: application
    platform: iOS
    sources:
      - path: Sayboard
        excludes:
          - Resources/Tokenizers
      - path: Sayboard/Resources/Tokenizers
        type: folder
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.voxboard
        INFOPLIST_FILE: Sayboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sayboard/Sayboard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sayboard/Sayboard-Bridging-Header.h
    dependencies:
      - target: SayboardKeyboard
      - target: VoxBoardWatch
      - package: WhisperKit
      - package: DSWaveformImage
        product: DSWaveformImageViews
      - package: FluidAudio
      - package: ZIPFoundation
      - package: Moonshine
      - package: LlamaCpp
        product: llama
    postCompileScripts:
      - script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if command -v swiftlint >/dev/null 2>&1; then
            echo "SwiftLint runs in the development repo, not here"
          else
            echo "warning: SwiftLint not installed. Run: brew install swiftlint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false
      - script: |
          "${SRCROOT}/scripts/lint-strings.sh"
        name: Lint String Catalogs
        basedOnDependencyAnalysis: false

  SayboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SayboardTests
      - path: Shared
      - path: StoreKit/Sayboard.storekit
        buildPhase: resources
    dependencies:
      - target: Sayboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.voxboard.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # StoreKitTest's own SKTestTransaction.h uses SKPaymentTransactionState, deprecated in iOS 18, and the
        # explicit module build compiles it with -Werror (iOS 26.2 SDK, verified 2026-09-16).
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-error=deprecated-declarations"

  VoxBoardWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: VoxBoardWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.voxboard.watchkitapp
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "40"
        INFOPLIST_KEY_CFBundleDisplayName: VoxBoard
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.voxboard
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: false
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "VoxBoard records your voice so your iPhone can turn it into a message."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: true

  SayboardKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: SayboardKeyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.voxboard.keyboard
        INFOPLIST_FILE: SayboardKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: SayboardKeyboard/SayboardKeyboard.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: SayboardKeyboard/SayboardKeyboard-Bridging-Header.h
        SKIP_INSTALL: true
    dependencies: []
    postCompileScripts:
      - script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if command -v swiftlint >/dev/null 2>&1; then
            echo "SwiftLint runs in the development repo, not here"
          else
            echo "warning: SwiftLint not installed. Run: brew install swiftlint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false
    scheme:
      testTargets: []

  VoxBoardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VoxBoardUITests
    dependencies:
      - target: Sayboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.voxboard.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Sayboard

  VoxBoardKeyboardFixture:
    type: application
    platform: iOS
    sources:
      - path: VoxBoardKeyboardFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.voxboard.keyboardfixture
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "VoxBoard Test Field"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    scheme: {}

schemes:
  # VoxBoard builds are unrestricted, including archives.
  VoxBoard:
    build:
      targets:
        Sayboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SayboardTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # For trying the purchase locally against StoreKit/Sayboard.storekit; not used for releases.
  VoxBoard StoreKit:
    build:
      targets:
        Sayboard: all
    run:
      config: AppStore
      storeKitConfiguration: StoreKit/Sayboard.storekit
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore

  VoxBoard Device Tests:
    build:
      targets:
        Sayboard: all
        VoxBoardUITests: [test]
    test:
      config: Debug
      targets:
        - SayboardTests
        - VoxBoardUITests
